<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Gestão — Vizelgolfe</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#060d18;--navy2:#0a1828;--navy3:#0f2240;--gold:#c9a84c;--gold2:#e8c675;--border:rgba(201,168,76,.22);--text:#e8eef8;--text2:#8faac8;--text3:#5a7a98}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--navy);color:var(--text);font-family:'Outfit',system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#060d18,#0a1828)}
header img{height:2.3rem;width:2.3rem;object-fit:contain;border-radius:50%;background:#fff}
.ttl{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.14em;color:var(--gold);line-height:1}
.sub{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-top:.1rem}
.sp{flex:1}
header a{font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:.12em;color:#5dade2;border:1px solid rgba(46,134,193,.35);padding:.3rem .8rem;border-radius:4px;text-decoration:none;background:rgba(46,134,193,.08);white-space:nowrap}
nav{display:flex;border-bottom:1px solid var(--border);background:rgba(6,13,24,.96)}
nav button{flex:1;font:inherit;background:none;border:0;border-bottom:3px solid transparent;color:var(--text3);cursor:pointer;padding:.55rem .2rem .45rem;display:flex;flex-direction:column;align-items:center;gap:.05rem;min-width:0}
nav button .ic{font-size:1.25rem;line-height:1}
nav button b{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.1em;font-weight:400;white-space:nowrap}
nav button small{font-size:.6rem;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav button.on{color:var(--gold);border-bottom-color:var(--gold);background:rgba(201,168,76,.06)}
nav button:hover:not(.on){color:var(--text2)}
#barra{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.4rem 1rem;background:var(--navy2);border-bottom:1px solid var(--border);font-size:.8rem;color:var(--text2)}
#barra .txt{flex:1;min-width:12rem;line-height:1.4}
#barra button,#barra a{font:inherit;font-size:.75rem;color:var(--gold2);background:rgba(201,168,76,.08);border:1px solid var(--border);border-radius:4px;padding:.28rem .7rem;cursor:pointer;text-decoration:none;white-space:nowrap}
#barra .forte{background:var(--gold);color:#060d18;font-weight:600;border-color:var(--gold)}
#frames{flex:1;position:relative;min-height:0;background:#fff}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
#frames iframe.on{display:block}
#aviso{display:none;padding:.5rem 1rem;font-size:.8rem;background:#fef3c7;color:#92400e}
#bAjuda{display:none}
@media (max-width:520px){
 header .sub{display:none}.ttl{font-size:1.15rem;letter-spacing:.1em}
 nav button b{font-size:.9rem}nav button small{font-size:.55rem}
 #barra{padding:.3rem .6rem;gap:.35rem}#barra .txt{display:none;flex-basis:100%;min-width:0}
 #barra.mostra .txt{display:block;order:9}#bAjuda{display:inline-block}
}
</style>
</head>

const BASE='https://vizelgolfe.net/';
document.getElementById('logo').src=LOGO;
const TABS=[
  {id:'camp',ic:'🏆',nome:'Campeonato',sub:'e Nacional',src:'consola.html',
   txt:'Campeonato de Vizela e Nacional: atletas, jornadas, resultados e classificações.'},
  {id:'torneios',ic:'⛳',nome:'Torneios',sub:'livres',src:'torneio-livre.html',
   txt:'Criar torneios (categorias e voltas à tua escolha), inscrever jogadores e lançar resultados.'},
  {id:'tv',ic:'📺',nome:'TV',sub:'o que mostrar',src:'tv-controlo.html',
   txt:'Escolhe o que aparece no ecrã do projetor e o que fica visível. O projetor abre sempre o mesmo link.',
   copiar:['Copiar link do projetor',BASE+'tv.html?modo=tv']},
  {id:'atletas',ic:'📱',nome:'Atletas',sub:'link e ecrã',src:'tv.html',
   txt:'Isto é o que os atletas veem. Este é o único link a dar-lhes.',
   copiar:['Copiar link para atletas',BASE+'tv.html'],forte:true}
];
const $=id=>document.getElementById(id);
let atual=null;
function montar(){
  $('tabs').innerHTML=TABS.map(t=>'<button data-id="'+t.id+'" title="'+t.nome+'"><span class="ic">'+t.ic+'</span><b>'+t.nome+'</b><small>'+t.sub+'</small></button>').join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>ir(b.dataset.id));
  const h=(location.hash||'').slice(1);
  ir(TABS.some(t=>t.id===h)?h:'camp');
}
function ir(id){
  const t=TABS.find(x=>x.id===id);if(!t)return;atual=t;
  $('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  let f=$('f-'+id);
  if(!f){f=document.createElement('iframe');f.id='f-'+id;f.src=t.src;f.title=t.nome;f.allow='clipboard-write; fullscreen';f.setAttribute('loading','eager');$('frames').appendChild(f)}
  document.querySelectorAll('#frames iframe').forEach(x=>x.classList.toggle('on',x===f));
  let h='<span class="txt">'+t.txt+'</span><span class="sp"></span><button id="bAjuda">?</button>';
  if(t.copiar)h+='<button class="'+(t.forte?'forte':'')+'" id="bCopiar">'+t.copiar[0]+'</button>';
  h+='<button id="bRec">Recarregar</button><a href="'+t.src+'" target="_blank" rel="noopener">Abrir sozinho ↗</a>';
  $('barra').innerHTML=h;
  $('bRec').onclick=()=>{f.src=t.src};
  $('bAjuda').onclick=()=>$('barra').classList.toggle('mostra');
  $('barra').classList.remove('mostra');
  if(t.copiar)$('bCopiar').onclick=async()=>{const b=$('bCopiar'),o=t.copiar[0];
    try{await navigator.clipboard.writeText(t.copiar[1]);b.textContent='Copiado ✓'}catch(e){prompt('Copia o link:',t.copiar[1])}setTimeout(()=>b.textContent=o,1800)};
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
montar();
addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(TABS.some(x=>x.id===h)&&(!atual||atual.id!==h))ir(h)});
</script>
