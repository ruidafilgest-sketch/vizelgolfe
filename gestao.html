<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060d18">
<title>Gestão — Vizelgolfe</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#060d18;--navy2:#0a1828;--navy3:#0f2240;--gold:#c9a84c;--gold2:#e8c675;--border:rgba(201,168,76,.22);--text:#e8eef8;--text2:#8faac8;--text3:#5a7a98;--err:#f08a7d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--navy);color:var(--text);font-family:'Outfit',system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#060d18,#0a1828)}
header img{height:2.3rem;width:2.3rem;object-fit:contain;border-radius:50%;background:#fff}
.ttl{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.14em;color:var(--gold);line-height:1}
.sub{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-top:.1rem}
.sp{flex:1}
.hb{font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:.12em;color:#5dade2;border:1px solid rgba(46,134,193,.35);padding:.3rem .7rem;border-radius:4px;text-decoration:none;background:rgba(46,134,193,.08);white-space:nowrap;cursor:pointer;font-family:'Bebas Neue',sans-serif}
.hb.sair{color:var(--text2);border-color:var(--border);background:transparent}
#login{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem}
.cartao{width:100%;max-width:360px;background:var(--navy2);border:1px solid var(--border);border-radius:12px;padding:1.6rem 1.4rem;text-align:center}
.cartao img{height:4rem;width:4rem;border-radius:50%;background:#fff;object-fit:contain;margin-bottom:.6rem}
.cartao h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:1.6rem;letter-spacing:.14em;color:var(--gold);margin-bottom:.2rem}
.cartao p{font-size:.8rem;color:var(--text3);margin-bottom:1rem;line-height:1.5}
.cartao input{width:100%;font:inherit;padding:.65rem .75rem;margin-bottom:.6rem;background:var(--navy);color:var(--text);border:1px solid var(--border);border-radius:8px}
.cartao button{width:100%;font:inherit;font-weight:600;padding:.7rem;background:var(--gold);color:#060d18;border:0;border-radius:8px;cursor:pointer;margin-top:.2rem}
.cartao button:disabled{opacity:.5;cursor:default}
#lmsg{min-height:1.3rem;font-size:.82rem;color:var(--err);margin-top:.6rem;line-height:1.4}
#app{flex:1;display:none;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--border);background:rgba(6,13,24,.96)}
#tabs button{flex:1;font:inherit;background:none;border:0;border-bottom:3px solid transparent;color:var(--text3);cursor:pointer;padding:.55rem .2rem .45rem;display:flex;flex-direction:column;align-items:center;gap:.05rem;min-width:0}
#tabs .ic{font-size:1.25rem;line-height:1}
#tabs b{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.1em;font-weight:400;white-space:nowrap}
#tabs small{font-size:.6rem;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#tabs button.on{color:var(--gold);border-bottom-color:var(--gold);background:rgba(201,168,76,.06)}
#tabs button:hover:not(.on){color:var(--text2)}
#subtabs{display:none;gap:.4rem;padding:.4rem 1rem;background:var(--navy2);border-bottom:1px solid var(--border)}
#subtabs button{font:inherit;font-size:.82rem;font-weight:500;color:var(--text2);background:transparent;border:1px solid var(--border);border-radius:999px;padding:.3rem .95rem;cursor:pointer}
#subtabs button.on{background:var(--gold);color:#060d18;border-color:var(--gold);font-weight:600}
#barra{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.4rem 1rem;background:var(--navy2);border-bottom:1px solid var(--border);font-size:.8rem;color:var(--text2)}
#barra .txt{flex:1;min-width:12rem;line-height:1.4}
#barra button,#barra a{font:inherit;font-size:.75rem;color:var(--gold2);background:rgba(201,168,76,.08);border:1px solid var(--border);border-radius:4px;padding:.28rem .7rem;cursor:pointer;text-decoration:none;white-space:nowrap}
#barra .forte{background:var(--gold);color:#060d18;font-weight:600;border-color:var(--gold)}
#bAjuda{display:none}
#frames{flex:1;position:relative;min-height:0;background:#fff}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
#frames iframe.on{display:block}
#avisos{display:none;background:#3a2c08;border-bottom:1px solid var(--gold)}
#avisos .av{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.5rem 1rem;font-size:.85rem;color:var(--gold2)}
#avisos .av span{flex:1;min-width:14rem;line-height:1.4}
#avisos button{font:inherit;font-size:.78rem;font-weight:600;background:var(--gold);color:#060d18;border:0;border-radius:6px;padding:.3rem .8rem;cursor:pointer}
#avisos button.sec{background:transparent;color:var(--gold2);border:1px solid var(--border)}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#0f2a18;color:#7bd88f;border:1px solid #1e8449;padding:.55rem 1.1rem;border-radius:8px;font-size:.85rem;z-index:50;display:none;max-width:90vw;text-align:center}
#toast.err{background:#33110d;color:var(--err);border-color:#7a2a20}
@media (max-width:560px){
 header .sub{display:none}.ttl{font-size:1.1rem;letter-spacing:.1em}
 .hb .lbl{display:none}
 #tabs b{font-size:1rem}#tabs small{font-size:.55rem}
 #barra{padding:.3rem .6rem;gap:.35rem}#barra .txt{display:none;flex-basis:100%;min-width:0}
 #barra.mostra .txt{display:block;order:9}#bAjuda{display:inline-block}
 #subtabs{padding:.4rem .6rem;overflow-x:auto}
}
</style>
</head>
<body>
<header>
  <img id="logo" alt="Vizelgolfe">
  <div><div class="ttl">VIZELGOLFE · GESTÃO</div><div class="sub">Um só sítio para tudo</div></div>
  <div class="sp"></div>
  <button class="hb" id="bCopia" style="display:none" title="Cópia de segurança">💾<span class="lbl"> CÓPIA</span></button>
  <a class="hb" href="https://ruidafilgest-sketch.github.io/hub/vizelgolfe.html">HUB</a>
  <button class="hb sair" id="bSair" style="display:none" title="Sair">⏻<span class="lbl"> SAIR</span></button>
</header>

<div id="login">
  <div class="cartao">
    <img id="logo2" alt="">
    <h1>ENTRAR</h1>
    <p id="lstatus">A verificar a sessão…</p>
    <div id="lform" style="display:none">
      <input id="em" type="email" placeholder="Email de administrador" autocomplete="username">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <button id="bEntrar">Entrar</button>
    </div>
    <div id="lmsg"></div>
  </div>
</div>

<div id="app">
  <div id="avisos"></div>
  <nav id="tabs"></nav>
  <div id="subtabs"></div>
  <div id="barra"></div>
  <div id="frames"></div>
</div>

<div id="toast"></div>

const CFG_PO={apiKey:"AIzaSyBZEkEaZ1lb1O2mFLnlCV6pulBq4cDjAqQ",authDomain:"vizelgolfe-portal.firebaseapp.com",databaseURL:"https://vizelgolfe-portal-default-rtdb.europe-west1.firebasedatabase.app",projectId:"vizelgolfe-portal",storageBucket:"vizelgolfe-portal.firebasestorage.app",messagingSenderId:"651151089287",appId:"1:651151089287:web:d7f044bbb6c64f2e8fa222"};
const $=id=>document.getElementById(id);
$('logo').src=LOGO;$('logo2').src=LOGO;

/* ---------- separadores ---------- */
const V={
  camp:{g:'comp',nome:'Campeonato e Nacional',src:'consola.html',txt:'Campeonato de Vizela e Nacional: atletas, jornadas, resultados e classificações.'},
  torneios:{g:'comp',nome:'Torneios livres',src:'torneio-livre.html',txt:'Criar torneios (categorias e voltas à tua escolha), inscrever jogadores e lançar resultados.'},
  ecras:{g:'ecras',nome:'Ecrãs',src:'tv-controlo.html',txt:'Escolhe o que aparece no ecrã do projetor. O link único dos atletas está aqui. Os torneios novos publicam-se sozinhos.',auto:true,
    copiar:[['Link do projetor',BASE+'tv.html?modo=tv',false],['Link para atletas',BASE+'tv.html',true]],
    extra:[['Ver como os atletas veem ↗',BASE+'tv.html']]},
  copia:{g:'copia',nome:'Cópia de segurança',src:'copia-seguranca.html',txt:'Guarda num ficheiro uma cópia de todos os dados. Faz isto antes de qualquer alteração importante.'}
};
const GRUPOS=[{id:'comp',ic:'🏆',nome:'Competições',sub:'campeonato, nacional e torneios',vista:'camp'},{id:'ecras',ic:'📺',nome:'Ecrãs',sub:'projetor e atletas',vista:'ecras'}];
const ALIAS={tv:'ecras',atletas:'ecras',competicoes:'camp'};
let atual=null,ultimaComp='camp',noApp=false;

function escolhido(){const h=(location.hash||'').slice(1),k=ALIAS[h]||h;return V[k]?k:'camp'}
function montar(){
  $('tabs').innerHTML=GRUPOS.map(g=>'<button data-g="'+g.id+'"><span class="ic">'+g.ic+'</span><b>'+g.nome+'</b><small>'+g.sub+'</small></button>').join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{const g=GRUPOS.find(x=>x.id===b.dataset.g);ir(g.id==='comp'?ultimaComp:g.vista)});
  $('subtabs').innerHTML=['camp','torneios'].map(k=>'<button data-v="'+k+'">'+V[k].nome+'</button>').join('');
  $('subtabs').querySelectorAll('button').forEach(b=>b.onclick=()=>ir(b.dataset.v));
  ir(escolhido());
}
function ir(id){
  const t=V[id];if(!t)return;atual={id,...t};if(t.g==='comp')ultimaComp=id;
  $('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.g===t.g));
  $('subtabs').style.display=t.g==='comp'?'flex':'none';
  $('subtabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===id));
  let f=$('f-'+id);
  if(!f){f=document.createElement('iframe');f.id='f-'+id;f.src=t.srcInicial||t.src;f.title=t.nome;f.allow='clipboard-write; fullscreen';$('frames').appendChild(f)}
  document.querySelectorAll('#frames iframe').forEach(x=>x.classList.toggle('on',x===f));
  let h='<span class="txt">'+t.txt+'</span><span class="sp"></span><button id="bAjuda">?</button>';
  (t.copiar||[]).forEach((c,i)=>{h+='<button class="'+(c[2]?'forte':'')+'" data-c="'+i+'">'+c[0]+'</button>'});
  (t.extra||[]).forEach(e=>{h+='<a href="'+e[1]+'" target="_blank" rel="noopener">'+e[0]+'</a>'});
  if(t.auto)h+='<button id="bAuto"></button>';
  h+='<button id="bRec">Recarregar</button><a href="'+t.src+'" target="_blank" rel="noopener">Abrir sozinho ↗</a>';
  $('barra').innerHTML=h;
  $('bRec').onclick=()=>{f.src=t.src};
  if(t.auto){$('bAuto').onclick=alternarAuto;atualizarBarra()}
  $('bAjuda').onclick=()=>$('barra').classList.toggle('mostra');$('barra').classList.remove('mostra');
  $('barra').querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{const c=t.copiar[Number(b.dataset.c)],o=c[0];
    try{await navigator.clipboard.writeText(c[1]);b.textContent='Copiado ✓'}catch(e){prompt('Copia o link:',c[1])}setTimeout(()=>b.textContent=o,1800)});
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
// o botão «Usar como jornada» (no torneio) pede à Consola para abrir a importação
addEventListener('message',ev=>{
  if(ev.origin!==location.origin||!noApp)return;
  const d=ev.data;if(!d||d.vzg!=='importar'||!d.id)return;
  const f=$('f-camp');
  if(f){ir('camp');f.contentWindow.postMessage({vzg:'importar',id:d.id},location.origin)}
  else{V.camp.srcInicial='consola.html#importar='+encodeURIComponent(d.id);ir('camp');delete V.camp.srcInicial}
});
addEventListener('hashchange',()=>{if(!noApp)return;const k=escolhido();if(!atual||atual.id!==k)ir(k)});

/* ---------- entrada única (Firebase Auth, o mesmo login do Torneios Livres) ---------- */
function abrirApp(){
  if(noApp)return;noApp=true;
  try{sessionStorage.setItem('vzgAdmin','1')}catch(e){}   // as ferramentas lá dentro reconhecem a sessão
  $('login').style.display='none';$('app').style.display='flex';
  $('bSair').style.display='';$('bCopia').style.display='';
  $('bCopia').onclick=()=>ir('copia');
  montar();
  iniciarVigia();
}
function mostrarLogin(msg){
  $('lstatus').textContent='Acesso reservado a administradores.';
  $('lform').style.display='block';$('lmsg').textContent=msg||'';
  $('bEntrar').disabled=false;
}
let auth=null,A=null,APP=null;
async function arrancar(){
  $('lstatus').textContent='A verificar a sessão…';$('lform').style.display='none';$('lmsg').textContent='';
  try{
    const B='https://www.gstatic.com/firebasejs/10.12.0/';
    const [app,au]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js')]);
    A=au;APP=app;auth=au.getAuth(app.initializeApp(CFG_PO));   // app por defeito: partilha a sessão com o Torneios Livres
  }catch(e){
    $('lstatus').textContent='Não foi possível ligar. Verifica a internet.';
    $('lform').style.display='block';$('em').style.display='none';$('pw').style.display='none';
    $('bEntrar').textContent='Tentar de novo';$('bEntrar').onclick=()=>location.reload();return;
  }
  A.onAuthStateChanged(auth,user=>{
    if(user&&user.uid===ADMIN_UID){abrirApp()}
    else if(user){A.signOut(auth)}
    else if(!noApp){mostrarLogin()}
  });
}
async function entrar(){
  const em=$('em').value.trim(),pw=$('pw').value;
  if(!em||!pw){$('lmsg').textContent='Preenche o email e a password.';return}
  $('bEntrar').disabled=true;$('lmsg').textContent='';
  try{const c=await A.signInWithEmailAndPassword(auth,em,pw);
    if(c.user.uid!==ADMIN_UID){await A.signOut(auth);throw new Error('nao-admin')}}
  catch(e){$('lmsg').textContent='Email ou password incorretos.';$('bEntrar').disabled=false}
}
$('bEntrar').onclick=entrar;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});
$('em').addEventListener('keydown',e=>{if(e.key==='Enter')$('pw').focus()});
$('bSair').onclick=async()=>{try{await A.signOut(auth)}catch(e){}try{sessionStorage.removeItem('vzgAdmin')}catch(e){}location.hash='';location.reload()};

/* ---------- publicação automática dos torneios novos ---------- */
const CFG_EC={apiKey:"AIzaSyDr7wfBzKbH1VAiXbte4YzkejuvJpQvltE",authDomain:"vizelgolfe-ec270.firebaseapp.com",projectId:"vizelgolfe-ec270",storageBucket:"vizelgolfe-ec270.firebasestorage.app",messagingSenderId:"386073357614",appId:"1:386073357614:web:098f635403f605650e5ebf"};
const ROOT='/portal/torneiosLivres',CHAVE='VZG-2026-SEC-K9x',PUSH='-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// o identificador de um torneio guarda o momento em que foi criado
const quando=id=>{id=String(id);if(id.length<8)return 0;let t=0;for(const c of id.slice(0,8)){const k=PUSH.indexOf(c);if(k<0)return 0;t=t*64+k}return t};
let FSM=null,RTM=null,fsDb=null,CT=null,TOR={},torTimer=null,publicando=false,toastT=null,vigiaOn=false;
function toast(msg,err){const e=$('toast');e.textContent=msg;e.className=err?'err':'';e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',err?6000:4500)}
async function gravarCT(parcial){
  await FSM.setDoc(FSM.doc(fsDb,'vizelgolfe','tv_controlo'),{...parcial,atualizadoEm:new Date().toISOString(),_vzgKey:CHAVE},{merge:true});
}
async function iniciarVigia(){
  if(vigiaOn)return;vigiaOn=true;
  try{   // parte opcional: se falhar, a Gestão funciona na mesma
    const B='https://www.gstatic.com/firebasejs/10.12.0/';
    const [f,d]=await Promise.all([import(B+'firebase-firestore.js'),import(B+'firebase-database.js')]);
    FSM=f;RTM=d;fsDb=f.getFirestore(APP.initializeApp(CFG_EC,'ec270'));
    const rtDb=d.getDatabase(APP.getApp());
    f.onSnapshot(f.doc(fsDb,'vizelgolfe','tv_controlo'),s=>{CT=s.exists()?s.data():{};avaliarSoon();atualizarBarra()},e=>console.warn('vigia: tv_controlo',e.code));
    d.onChildAdded(d.ref(rtDb,ROOT),s=>{TOR[s.key]=s.val();avaliarSoon()},e=>console.warn('vigia: torneios',e.code));
    // um torneio eliminado deixa de aparecer aos atletas (e sai do projetor, se lá estiver)
    d.onChildRemoved(d.ref(rtDb,ROOT),async s=>{
      const id=s.key;delete TOR[id];if(!CT)return;
      try{
        const antes=CT.publicados||[],lista=antes.filter(p=>p.id!==id),parcial={};
        if(lista.length!==antes.length)parcial.publicados=lista;
        if(CT.fonte==='livre'&&CT.livre&&CT.livre.id===id){parcial.fonte='camp';parcial.camp={prova:'__anual__',vista:'geral'};parcial.livre={id:''}}
        if(Object.keys(parcial).length){await gravarCT(parcial);toast('Torneio eliminado: já não aparece aos atletas.')}
      }catch(e){console.warn('vigia: limpeza',e)}
    });
  }catch(e){console.warn('vigia indisponível',e)}
}
function avaliarSoon(){clearTimeout(torTimer);torTimer=setTimeout(avaliar,300)}
async function avaliar(){
  if(!CT||publicando)return;
  if(CT.autoPublicar===undefined){   // primeira vez: liga a publicação automática, só para torneios criados daqui para a frente
    publicando=true;try{await gravarCT({autoPublicar:true,autoPublicarDesde:Date.now()})}catch(e){console.warn(e)}publicando=false;return}
  const pub=new Set((CT.publicados||[]).map(p=>p.id)),nao=new Set(CT.naoPublicar||[]);
  const sete=Date.now()-7*864e5,desde=CT.autoPublicarDesde||Infinity;
  const pend=Object.keys(TOR).filter(id=>!pub.has(id)&&!nao.has(id)&&quando(id)>=sete);
  const auto=CT.autoPublicar?pend.filter(id=>quando(id)>=desde):[];
  if(auto.length){await publicar(auto,true);return}
  avisos(pend);
}
async function publicar(ids,auto){
  if(publicando)return;publicando=true;
  try{
    const lista=[...(CT.publicados||[])];const nomes=[];
    ids.forEach(id=>{if(!lista.some(p=>p.id===id)){const m=TOR[id]?.meta||{};lista.push({id,nome:m.nome||'Torneio',data:m.data||'',prova:m.provaCalendario||''});nomes.push(m.nome||'Torneio')}});
    if(nomes.length){await gravarCT({publicados:lista});toast('✓ '+(auto?'Publicado automaticamente: ':'Publicado: ')+nomes.map(n=>'«'+n+'»').join(', '))}
  }catch(e){toast('Não foi possível publicar ('+(e.code||e.message)+'). Publica em Ecrãs.',true)}
  publicando=false;
}
function avisos(ids){
  const box=$('avisos');
  if(!ids.length){box.style.display='none';box.innerHTML='';return}
  box.style.display='block';
  box.innerHTML=ids.map(id=>'<div class="av"><span>⚠ O torneio <b>«'+esc(TOR[id]?.meta?.nome||'Torneio')+'»</b> ainda não está publicado: os atletas não o veem.</span><button data-p="'+esc(id)+'">Publicar</button><button class="sec" data-n="'+esc(id)+'">Não publicar</button></div>').join('');
  box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>publicar([b.dataset.p],false));
  box.querySelectorAll('[data-n]').forEach(b=>b.onclick=async()=>{try{await gravarCT({naoPublicar:[...(CT.naoPublicar||[]),b.dataset.n]})}catch(e){toast('Não foi possível guardar.',true)}});
}
function atualizarBarra(){const b=$('bAuto');if(!b)return;if(!CT){b.textContent='Publicação automática…';return}const on=!!(CT&&CT.autoPublicar);b.textContent='Publicação automática: '+(on?'ligada':'desligada');b.className=on?'':'forte'}
async function alternarAuto(){
  if(!CT){toast('A ligar… tenta daqui a uns segundos.',true);return}
  const lig=!CT.autoPublicar;
  try{await gravarCT(lig?{autoPublicar:true,autoPublicarDesde:Date.now()}:{autoPublicar:false});toast(lig?'Publicação automática ligada: os torneios novos publicam-se sozinhos.':'Publicação automática desligada.')}
  catch(e){toast('Não foi possível alterar ('+(e.code||e.message)+').',true)}
}
arrancar();
</script>
