<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vizelgolfe — Resultados</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--bg2:#f2f4f8;--txt:#0f1e35;--txt2:#5b6b85;--acc:#a97516;--acc2:#8a5d0c;
  --line:rgba(15,30,53,.13);--row:rgba(15,30,53,.04);--head:rgba(15,30,53,.07);
  --p1:#a86f08;--p2:#5d6d88;--p3:#a05f33;--vzg:rgba(169,117,22,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body.tv{font-size:clamp(12px,1.05vw,22px)}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
body.tv{height:100vh;overflow:hidden}
header{display:flex;align-items:center;gap:.9rem;padding:.7rem 1rem;border-bottom:3px solid var(--acc);background:var(--bg2)}
header img{height:2.6rem;width:2.6rem;object-fit:contain}
.ttl{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:.1rem;line-height:1;color:var(--acc2)}
.sub{font-family:'Barlow Condensed',sans-serif;font-size:.95rem;letter-spacing:.1rem;text-transform:uppercase;color:var(--txt2);margin-top:.15rem}
.sp{flex:1}
#live{font-size:.7rem;font-weight:700;letter-spacing:.08rem;padding:.2rem .6rem;border-radius:999px;border:1px solid var(--acc);color:var(--acc2);white-space:nowrap}
#live.off{border-color:#dc2626;color:#dc2626}
#clock{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;color:var(--txt)}
body.tv header{padding:1rem 2rem;gap:1.2rem}
body.tv header img{height:3.6rem;width:3.6rem}
body.tv .ttl{font-size:2.6rem}body.tv .sub{font-size:1.15rem}body.tv #clock{font-size:2.4rem}body.tv #live{font-size:.8rem}
#menu{display:none;padding:.6rem 1rem;border-bottom:1px solid var(--line);background:var(--bg);gap:.5rem 1rem;flex-wrap:wrap;align-items:center}
body:not(.tv) #menu{display:flex}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;font-size:.95rem;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:.35rem .95rem;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
#menu select{font:inherit;font-size:.95rem;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:.35rem .6rem;max-width:100%}
#cats{display:flex;gap:.4rem;overflow-x:auto;padding:.6rem 1rem 0;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
body.tv #cats{display:none}
#stage{flex:1;position:relative;min-height:0}
body.tv #stage{overflow:hidden}
.slide{display:flex;flex-direction:column;padding:.6rem 1rem 1rem}
body.tv .slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .9s;padding:1rem 2rem 0}
body.tv .slide.active{opacity:1;pointer-events:auto}
.badge{align-self:flex-start;font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.08rem;background:var(--acc);color:#fff;padding:.1rem .9rem;border-radius:8px 8px 0 0}
body.tv .badge{font-size:2rem;padding:.15rem 1.1rem}
.scroller{flex:1;overflow-x:auto;border:1px solid var(--line);border-radius:0 10px 10px 10px;background:var(--bg)}
body.tv .scroller{overflow:hidden;border-radius:0 10px 0 0}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--head);font-family:'Barlow Condensed',sans-serif;font-size:.8rem;letter-spacing:.08rem;text-transform:uppercase;color:var(--txt2);padding:.55rem .5rem;text-align:left;z-index:2;white-space:nowrap}
body.tv thead th{font-size:1rem;padding:.7rem .8rem}
th.c,td.c{text-align:center}th.r,td.r{text-align:right}
tbody td{padding:.5rem .5rem;border-bottom:1px solid var(--line);font-size:1rem;font-weight:600}
body.tv tbody td{padding:.65rem .8rem;font-size:1.5rem}
tbody tr:nth-child(even){background:var(--row)}
tbody tr.vzg{background:var(--vzg)}
.pos{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--txt2);text-align:center;width:2.6rem}
body.tv .pos{font-size:2.2rem;width:4.5rem}
tr.p1 .pos{color:var(--p1)}tr.p2 .pos{color:var(--p2)}tr.p3 .pos{color:var(--p3)}
tr.p1 td,tr.p2 td,tr.p3 td{font-weight:700}
.nm{display:flex;align-items:center;gap:.55rem;min-width:9rem}
.club{width:1.7rem;height:1.7rem;object-fit:contain;flex:none}
.cc{width:1.7rem;height:1.7rem;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1.5px solid var(--acc);color:var(--acc2);font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700}
body.tv .club,body.tv .cc{width:2.3rem;height:2.3rem}body.tv .cc{font-size:.85rem}
.cl{font-size:.72rem;font-weight:500;color:var(--txt2);margin-top:.05rem}
body.tv .cl{font-size:.95rem}
.tot{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;color:var(--acc2);text-align:right;padding-right:.9rem!important;white-space:nowrap}
body.tv .tot{font-size:2.4rem;padding-right:1.4rem!important}
.sm{display:block;font-size:.7rem;font-weight:500;color:var(--txt2)}
body.tv .sm{font-size:.95rem}
.chip{display:inline-block;min-width:2.5rem;padding:.2rem .5rem;border-radius:8px;font-size:.95rem;font-weight:800;text-align:center}
body.tv .chip{min-width:4.2rem;padding:.3rem .8rem;font-size:1.3rem}
.vt-neutral{background:rgba(15,30,53,.06);color:var(--txt2)}
.vt-blue{background:#dbeafe;color:#1d4ed8}.vt-green{background:#dcfce7;color:#15803d}
.vt-red{background:#fee2e2;color:#b91c1c}.vt-black{background:#1f2937;color:#f3f4f6}
.nj{background:transparent;color:#dc2626;font-weight:600}
.empty{margin:auto;padding:3rem 1.5rem;color:var(--txt2);font-size:1.1rem;text-align:center;line-height:1.6}
body.tv .empty{font-size:1.6rem}
footer{display:flex;align-items:center;gap:.8rem;padding:.5rem 1rem;border-top:1px solid var(--line);background:var(--bg2);font-size:.8rem;color:var(--txt2)}
#dots{display:none;gap:.5rem;flex-wrap:wrap}
body.tv #dots{display:flex}body.tv footer{padding:.6rem 2rem;font-size:.85rem}
#dots span{font-family:'Barlow Condensed',sans-serif;font-size:.95rem;letter-spacing:.06rem;padding:.12rem .7rem;border-radius:999px;border:1px solid var(--line)}
#dots span.a{background:var(--acc);border-color:var(--acc);color:#fff}
#info{margin-left:auto}
@media (max-width:600px){
 header{gap:.6rem;padding:.55rem .8rem}
 header>div:nth-child(2){min-width:0;flex:1}
 .sp{display:none}
 .ttl{font-size:1.5rem}.sub{font-size:.8rem;letter-spacing:.05rem}
 #clock{display:none}#live{font-size:.6rem;padding:.15rem .45rem}
 .nm{min-width:0;gap:.35rem}.club,.cc{width:1.4rem;height:1.4rem}.cc{font-size:.55rem}
 .chip{min-width:1.8rem;padding:.15rem .3rem;font-size:.85rem}
 thead th,tbody td{padding:.4rem .3rem}
 .pos{width:1.8rem;font-size:1.2rem}.tot{font-size:1.3rem;padding-right:.5rem!important}
 .hm{display:none}.cl{font-size:.65rem}
 #cats,#menu{padding-left:.8rem;padding-right:.8rem}.slide{padding:.6rem .6rem 1rem}
}
</style>
</head>
<body>
<header>
  <img id="hlogo" alt="Vizelgolfe">
  <div><div class="ttl">VIZELGOLFE</div><div class="sub" id="sub">A carregar…</div></div>
  <div class="sp"></div>
  <div id="live">● AO VIVO</div>
  <div id="clock">--:--</div>
</header>
<div id="menu"></div>
<div id="cats"></div>
<div id="stage"><div class="empty">A carregar…</div></div>
<footer><div id="dots"></div><div id="info"></div></footer>

/* ---------- utilitários ---------- */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tick=()=>{$('clock').textContent=new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})};
setInterval(tick,1000);tick();
async function wake(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch(e){}}
if(MODO_TV){wake();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()})}
function ligacao(ok){const l=$('live');l.classList.toggle('off',!ok);l.textContent=ok?'● AO VIVO':'● SEM LIGAÇÃO'}

/* ---------- clubes (lista única) ---------- */
const CLUBES={VZG:'Vizelgolfe',NFC:'Necessidades Futebol Clube',CMP:'Clube Minigolfe Porto',MCL:'Minigolfe Clube Lamego',MCP:'Minigolfe Clube Portugal',ADA:'ADA Minigolfe Portel',IND:'Individual'};
const PALAVRAS=[[/VIZEL|VZG/,'VZG'],[/NECESSIDADES/,'NFC'],[/LAMEGO/,'MCL'],[/PORTUGAL/,'MCP'],[/PORTEL/,'ADA'],[/PORTO/,'CMP'],[/INDIVIDUAL/,'IND']];
function siglaClube(c){const u=(c||'').trim().toUpperCase();if(!u)return null;if(CLUBES[u])return u;
  const t=u.split(/[^A-Z]+/).filter(Boolean).find(x=>CLUBES[x]);if(t)return t;
  for(const[re,s]of PALAVRAS){if(re.test(u))return s}return null}
function clubeHtml(c){if(!c||!String(c).trim())return'';const s=siglaClube(c);
  if(s)return'<img class="club" src="'+LOGOS[s]+'" alt="'+s+'" title="'+CLUBES[s]+'">';
  const ini=String(c).trim().split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();
  return'<span class="cc" title="'+esc(c)+'">'+esc(ini)+'</span>'}
const isVzg=c=>{const x=(c||'').toLowerCase();return x.includes('vizelgolfe')||x.includes('vizelglfe')};

function corLivre(total,tipo){if(!total||total<=0)return'vt-neutral';
  if(tipo==='peter'){if(total<=24)return'vt-blue';if(total<=29)return'vt-green';if(total<=35)return'vt-red';return'vt-black'}
  if(total<=19)return'vt-blue';if(total<=24)return'vt-green';if(total<=29)return'vt-red';return'vt-black'}
const totalVolta=(r,i)=>parseInt(r?.[i]?.total)||0;
const totalGeral=(r,voltas)=>voltas.reduce((a,_,i)=>a+totalVolta(r,i),0);
const voltaVal=v=>{const n=Number(v);return(v!=null&&v!==''&&n>0)?n:null};
const mapNac={'cv-blue':'vt-blue','cv-green':'vt-green','cv-red':'vt-red','cv-gray':'vt-black'};
function corVoltaMini(v){const n=voltaVal(v);if(n===null)return'cv-null';if(n<=19)return'cv-blue';if(n<=24)return'cv-green';if(n<=29)return'cv-red';return'cv-gray'}
function corVoltaPeter(v){const n=voltaVal(v);if(n===null)return'cv-null';if(n<=24)return'cv-blue';if(n<=29)return'cv-green';if(n<=35)return'cv-red';return'cv-gray'}
function corTotal(total,nV,tipo){const n=Number(total);if(isNaN(n)||n<=0||!nV)return'';const m=n/nV;
  if(tipo==='mini'){if(m<=19)return'cv-blue';if(m<=24)return'cv-green';if(m<=29)return'cv-red';return'cv-gray'}
  if(m<=24)return'cv-blue';if(m<=29)return'cv-green';if(m<=35)return'cv-red';return'cv-gray'}

/* ---------- ligações (só leitura) ---------- */
async function iniciarSDK(){
  try{const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const[a,f,d]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-database.js')]);
    const appEc=a.initializeApp(CFG_EC,'ec270'),appPo=a.initializeApp(CFG_PO,'portal');
    FS=f;RT=d;fsDb=f.getFirestore(appEc);rtDb=d.getDatabase(appPo);return true}
  catch(e){return false}}
function escutarDoc(chave,docId,aoReceber){
  if(subs[chave])return;
  subs[chave]=FS.onSnapshot(FS.doc(fsDb,'vizelgolfe',docId),snap=>{D.erro[chave]=null;ligacao(true);aoReceber(snap.exists()?snap.data():null);aplicar()},
    err=>{D.erro[chave]=err.code||err.message;ligacao(false);aplicar()});
}
let ultimoDados=0;
async function carregarDados(){
  if(!FS||Date.now()-ultimoDados<60000)return;ultimoDados=Date.now();
  try{const s=await FS.getDoc(FS.doc(fsDb,'vizelgolfe','dados'));const dd=s.exists()?s.data():{};const m={};
    (dd.atletas||[]).forEach(a=>{m[String(a.id)]=a});D.atletas=m;
    D.provas=(dd.provas||[]).map(p=>({nome:p.nome,tipo:p.tipo,estado:p.estado,data:p.data,jornadas:p.jornadas,resultados:p.resultados,jornadaEspecial:p.jornadaEspecial}))}catch(e){}}
function garantir(ver,id){
  if(!FS)return;
  if(ver==='camp'||ver==='prova'){
    escutarDoc('rank','ranking_portal',d=>{D.rank=d?.ranking||null;D.rankHora=d?.atualizadoEm||null;carregarDados().then(aplicar)});
    if(!subs.dadosIni){subs.dadosIni=true;carregarDados().then(aplicar)}}
  if(ver==='nacional'){escutarDoc('nac','nacional',d=>{D.nac=d})}
  if(ver==='livre'&&id&&!subs['livre:'+id]){
    subs['livre:'+id]=RT.onValue(RT.ref(rtDb,ROOT+'/'+id),s=>{D.erro['livre:'+id]=null;ligacao(true);D.livre[id]=s.exists()?s.val():null;aplicar()},
      e=>{D.erro['livre:'+id]=e.code||e.message;aplicar()})}
}

/* ---------- provas do consola (Campeonato e torneios do clube) ---------- */
function provasDoRanking(rk){const m=new Map();
  Object.values(rk||{}).forEach(r=>(r.participacoes||[]).forEach(p=>{
    if(!m.has(p.prova))m.set(p.prova,{nome:p.prova,tipo:p.tipo,jornadas:new Set(),ult:''});
    const e=m.get(p.prova);e.jornadas.add(Number(p.jornada));if((p.data||'')>e.ult)e.ult=p.data||''}));
  return[...m.values()].map(e=>({nome:e.nome,tipo:e.tipo,jornadas:[...e.jornadas].sort((a,b)=>a-b),ult:e.ult}))}
const ORD_EST={ativo:0,concluido:1,'':1,agendado:2};
const EST_ROT={ativo:'🟢',concluido:'✅',agendado:'📅'};
function listaProvas(){
  const map=new Map();
  (D.provas||[]).forEach(p=>map.set(p.nome,{nome:p.nome,tipo:p.tipo||'torneio',estado:p.estado||'',data:p.data||'',njor:Math.max(Number(p.jornadas)||1,1)}));
  provasDoRanking(D.rank).forEach(r=>{const m=map.get(r.nome),mx=Math.max(...r.jornadas,1);
    if(m)m.njor=Math.max(m.njor,mx);else map.set(r.nome,{nome:r.nome,tipo:r.tipo||'torneio',estado:'',data:r.ult,njor:mx})});
  return[...map.values()].sort((a,b)=>{const ea=ORD_EST[a.estado]??1,eb=ORD_EST[b.estado]??1;if(ea!==eb)return ea-eb;
    return ea===2?(a.data||'9').localeCompare(b.data||'9'):(b.data||'').localeCompare(a.data||'')})}
const ehCampeonato=p=>p.tipo==='campeonato';

/* ---------- construção das listas ---------- */
const th=(t,c)=>'<th'+(c?' class="'+c+'"':'')+'>'+t+'</th>';
const linhaNome=(clube,nome,sub)=>'<div class="nm">'+clubeHtml(clube)+'<div><div>'+esc(nome)+'</div>'+(sub?'<div class="cl">'+esc(sub)+'</div>':'')+'</div></div>';
const tabela=(cab,linhas)=>'<table><thead><tr>'+cab+'</tr></thead><tbody>'+linhas+'</tbody></table>';
const posCls=i=>i<3?' p'+(i+1):'';
function agruparPorCat(lista){const g={};lista.forEach(x=>{(g[x.categoria||'Sem categoria']??=[]).push(x)});return g}
const soma=(arr,k)=>arr.reduce((s,p)=>s+(Number(p[k])||0),0);
const entradasRank=()=>Object.entries(D.rank||{}).map(([id,r])=>({id,...r}));
function slidesDe(lista,cab,fn){const g=agruparPorCat(lista);return ordenar(Object.keys(g),CAT_CAMP).map(cat=>({cat,html:tabela(cab,g[cat].map(fn).join(''))}))}
const voltaCell=(v,cor)=>{const n=voltaVal(v);
  if(n===null)return'<td class="c"><span class="chip vt-neutral">–</span></td>';
  if(n===126)return'<td class="c"><span class="chip nj" title="Não jogou">126</span></td>';
  return'<td class="c"><span class="chip '+(mapNac[cor(n)]||'vt-neutral')+'">'+n+'</span></td>'};
const infoRank=()=>D.rankHora?hora(D.rankHora):'';

function viewAnual(){
  if(!D.rank)return{msg:D.erro.rank?'Não foi possível ler o Campeonato ('+esc(D.erro.rank)+').':'Ainda sem classificações do Campeonato.'};
  const sub='Campeonato de Vizela · Ranking anual';
  const lista=entradasRank().map(r=>({...r,pts:Number(r.totalPontos)||0,tac:soma(r.participacoes||[],'total'),n:(r.participacoes||[]).length})).filter(r=>r.n>0);
  lista.sort((a,b)=>b.pts-a.pts||a.tac-b.tac||a.nome.localeCompare(b.nome,'pt'));
  if(!lista.length)return{sub,msg:'Ainda sem resultados.'};
  const cab=th('#','c')+th('Atleta')+th('Jornadas','c')+th('Pontos','r');
  const fn=(r,i)=>'<tr class="'+posCls(i).trim()+'"><td class="pos">'+(i+1)+'</td><td>'+linhaNome(D.atletas[r.id]?.clube,r.nome)+'</td><td class="c">'+r.n+'</td><td class="tot">'+r.pts+'</td></tr>';
  return{sub,slides:slidesDe(lista,cab,fn),info:infoRank()};
}

function viewProva(nome,vista){
  if(D.erro.rank&&!D.rank)return{msg:'Não foi possível ler os resultados ('+esc(D.erro.rank)+').'};
  const prova=listaProvas().find(p=>p.nome===nome);
  if(!prova)return{msg:D.provas.length||D.rank?'Esta prova já não está disponível.':'A carregar…'};
  const camp=ehCampeonato(prova)&&prova.njor>1;
  const aviso=prova.estado==='agendado'?'📅 Agendado'+(prova.data?' para '+fmtData(prova.data):'')+'. ':'';
  let sub,cab,fn,lista;
  if(camp&&(!vista||vista==='geral')){
    sub=prova.nome+' · Classificação geral';
    const js=Array.from({length:prova.njor},(_,i)=>i+1);
    lista=entradasRank().map(r=>{const ps=(r.participacoes||[]).filter(p=>p.prova===prova.nome);
      return{...r,ps,pts:soma(ps,'pontos'),tac:soma(ps,'total'),n:ps.length}}).filter(r=>r.n>0);
    lista.sort((a,b)=>b.pts-a.pts||a.tac-b.tac||a.nome.localeCompare(b.nome,'pt'));
    cab=th('#','c')+th('Atleta')+js.map(j=>th('J'+j,'c')).join('')+th('Pontos','r');
    fn=(r,i)=>'<tr class="'+posCls(i).trim()+'"><td class="pos">'+(i+1)+'</td><td>'+linhaNome(D.atletas[r.id]?.clube,r.nome)+'</td>'+
      js.map(j=>{const p=r.ps.find(x=>Number(x.jornada)===j);return'<td class="c">'+(p?(p.pontos+'<span class="sm">'+(p.ajuste?'ajuste':p.total+' tac.')+'</span>'):'–')+'</td>'}).join('')+'<td class="tot">'+r.pts+'</td></tr>';
  }else{
    const n=camp?(Number(vista)||1):1;
    sub=prova.nome+(camp?' · Jornada '+n:' · Resultados');
    const pd=D.provas.find(p=>p.nome===prova.nome);
    const esp=pd?.jornadaEspecial?.[n],p4=esp?.tipo==='peter4voltas';
    const rawDe=r=>{const j=pd?.resultados?.[n];return j?(j[r.id]||j[Number(r.id)]||null):null};
    lista=entradasRank().map(r=>{const p=(r.participacoes||[]).find(x=>x.prova===prova.nome&&Number(x.jornada)===n);return p?{...r,p,raw:rawDe(r)}:null}).filter(Boolean);
    lista.sort((a,b)=>((a.p.pos??1e9)-(b.p.pos??1e9))||(a.p.total-b.p.total)||a.nome.localeCompare(b.nome,'pt'));
    const comRaw=lista.some(r=>r.raw);
    const colV=p4?['pV1','pV2','pV3','pV4']:['mV1','mV2','pV1','pV2'],lblV=p4?['P1','P2','P3','P4']:['M1','M2','P1','P2'];
    cab=th('#','c')+th('Atleta')+(comRaw?lblV.map(l=>th(l,'c')).join(''):'')+th(comRaw?'Total':'Tacadas',comRaw?'r':'c')+(camp?th('Pontos','r'):'');
    fn=(r,i)=>{
      let cel='';
      if(comRaw){const cs=colV.map((c,k)=>voltaCell(r.raw?.[c],(p4||k>=2)?corVoltaPeter:corVoltaMini)).join('');
        const nV=colV.filter(c=>voltaVal(r.raw?.[c])!==null).length;
        const tc=mapNac[corTotal(r.p.total,nV,'peter')]||'';
        cel=cs+'<td class="r"><span class="chip '+tc+'">'+(r.p.ajuste?'–':r.p.total)+'</span></td>'}
      else cel='<td class="'+(camp?'c':'tot')+'">'+(r.p.ajuste?'–':r.p.total)+'</td>';
      return'<tr class="'+posCls(i).trim()+'"><td class="pos">'+(r.p.pos??i+1)+'</td><td>'+linhaNome(D.atletas[r.id]?.clube,r.nome)+'</td>'+cel+(camp?'<td class="tot">'+r.p.pontos+'</td>':'')+'</tr>'};
  }
  if(!lista.length)return{sub,msg:aviso+'Ainda sem resultados.'};
  return{sub,slides:slidesDe(lista,cab,fn),info:infoRank()};
}
const viewCamp=()=>SEL.prova==='__anual__'?viewAnual():viewProva(SEL.prova,SEL.vista);

/* ---------- Nacional (prova atual em «bangolfe», anteriores em «historico») ---------- */
function nacOpcoes(){
  const d=D.nac||{},out=[];
  if(d.bangolfe)out.push({chave:'atual',nome:'Atual · '+(d.bangolfe.nome||'Prova Nacional')});
  Object.entries(d.historico||{}).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([k,h])=>{
    if(d.bangolfe&&h.nome===d.bangolfe.nome&&String(h.ano)===String(d.bangolfe.ano))return;
    out.push({chave:k,nome:h.nome||k})});
  return out}
function nacEscolhido(){
  const d=D.nac;if(!d)return null;const k=SEL.nac||'atual';
  if(k==='atual')return d.bangolfe||Object.values(d.historico||{}).sort((a,b)=>String(b.atualizadoEm||'').localeCompare(String(a.atualizadoEm||'')))[0]||null;
  return d.historico?.[k]||d.bangolfe||null}
function viewNac(){
  if(!D.nac)return{msg:D.erro.nac?'Não foi possível ler o Nacional ('+esc(D.erro.nac)+').':'Ainda sem dados do Nacional.'};
  const d=nacEscolhido();if(!d)return{msg:'Ainda sem resultados do Nacional.'};
  const cats=d.categorias||{},vert=d.vertentes||{};
  const slides=ordenar(Object.keys(cats).filter(c=>(cats[c]||[]).length),CAT_NAC).map(cat=>{
    const at=cats[cat],disc=vert[cat]||'mini';
    const isMini=['Homens','Senhoras','H','S'].some(g=>cat===g||cat.startsWith(g))||disc==='mini';
    const cV=isMini?corVoltaMini:corVoltaPeter,maxV=Math.max(...at.map(a=>(a.voltas||[]).length),0);
    const cab=th('#','c')+th('Atleta')+Array.from({length:maxV},(_,i)=>th('V'+(i+1),'c')).join('')+th('Total','r')+th('Sit.','c hm');
    const rows=at.map((a,i)=>{const vz=isVzg(a.clube)&&!VZG_EXCECOES.includes(a.nome);
      const cells=Array.from({length:maxV},(_,k)=>{const v=(a.voltas||[])[k],n=voltaVal(v);
        if(n===null)return'<td class="c"><span class="chip vt-neutral">–</span></td>';
        if(n===126)return'<td class="c"><span class="chip nj" title="Não jogou">126</span></td>';
        return'<td class="c"><span class="chip '+(mapNac[cV(n)]||'vt-neutral')+'">'+n+'</span></td>'}).join('');
      const nV=(a.voltas||[]).filter(v=>voltaVal(v)!==null).length;
      const tc=a.dnf?'':(mapNac[corTotal(a.total,nV,isMini?'mini':'peter')]||'');
      return'<tr class="'+(posCls(i).trim()+(vz?' vzg':'')).trim()+'"><td class="pos">'+(a.rank||'–')+'</td><td>'+linhaNome(a.clube,a.nome,a.clube)+'</td>'+cells+
        '<td class="r">'+(a.dnf?'<span class="chip nj">DNF</span>':'<span class="chip '+tc+'">'+(a.total||'–')+'</span>')+'</td><td class="c hm">'+(a.dnf?'':(a.completo?'✅':'⏳'))+'</td></tr>'}).join('');
    return{cat,html:tabela(cab,rows)}});
  if(!slides.length)return{sub:'Nacional · '+(d.nome||'Prova Nacional'),msg:'Ainda sem resultados nesta prova.'};
  return{sub:'Nacional · '+(d.nome||'Prova Nacional'),slides,info:d.atualizadoEm?hora(d.atualizadoEm):''};
}

/* ---------- Torneios livres ---------- */
function viewLivre(){
  const id=SEL.id;if(!id)return{msg:'Nenhum torneio escolhido.'};
  const t=D.livre[id];
  if(D.erro['livre:'+id])return{msg:'Não foi possível ler este torneio ('+esc(D.erro['livre:'+id])+').'};
  if(t===undefined)return{msg:'A carregar o torneio…'};
  if(t===null)return{msg:'Este torneio não existe ou já não está disponível.'};
  const m=t.meta||{},cats=m.categorias||[],voltas=m.voltas||[],jog=t.jogadores||{};
  const sub=(m.nome||'Torneio')+(m.data?' · '+fmtData(m.data):'');
  if(!cats.length)return{sub,msg:'Este torneio ainda não tem categorias.'};
  const slides=cats.map(cat=>{
    const e=Object.values(jog).filter(j=>j.categoria===cat);
    const comp=r=>voltas.filter((v,i)=>totalVolta(r,i)>0).length;
    e.sort((a,b)=>{const ca=comp(a.resultados),cb=comp(b.resultados);if(ca!==cb)return cb-ca;if(!ca)return 0;return totalGeral(a.resultados,voltas)-totalGeral(b.resultados,voltas)});
    const cab=th('#','c')+th('Jogador')+voltas.map(v=>th(esc(v.label),'c')).join('')+th('Total','r');
    const rows=e.map((j,i)=>{const tot=totalGeral(j.resultados,voltas);const pc=(tot>0&&i<3)?'p'+(i+1):'';
      const ch=voltas.map((v,k)=>{const x=totalVolta(j.resultados,k);return'<td class="c"><span class="chip '+corLivre(x,v.tipo)+'">'+(x||'–')+'</span></td>'}).join('');
      return'<tr class="'+pc+'"><td class="pos">'+(tot>0?i+1:'–')+'</td><td>'+linhaNome(j.clube,j.nome)+'</td>'+ch+'<td class="tot">'+(tot||'–')+'</td></tr>'}).join('')||'<tr><td colspan="'+(3+voltas.length)+'" style="padding:1rem;color:var(--txt2)">Sem jogadores inscritos</td></tr>';
    return{cat,html:tabela(cab,rows)}});
  return{sub,slides};
}

/* ---------- apresentação ---------- */
let SL=[],idx=0,timer=null,raf=null;
function limparTimers(){clearTimeout(timer);cancelAnimationFrame(raf)}
function desenhar(v){
  $('sub').textContent=v.sub||'';$('info').textContent=v.info||'';
  const st=$('stage');
  if(v.msg||!v.slides?.length){st.innerHTML='<div class="empty">'+(v.msg||'Sem dados.')+'</div>';SL=[];$('dots').innerHTML='';$('cats').innerHTML='';limparTimers();return}
  const manter=SL[idx]?.cat;
  let slides=v.slides;
  if(MODO_TV&&CTRL.categoria){const f=slides.filter(s=>s.cat===CTRL.categoria);if(f.length)slides=f}
  SL=slides;
  if(MODO_TV){
    st.innerHTML=SL.map((s,i)=>'<div class="slide" id="s'+i+'"><div class="badge">'+esc(s.cat)+'</div><div class="scroller">'+s.html+'</div></div>').join('');
    $('dots').innerHTML=SL.map((s,i)=>'<span id="p'+i+'">'+esc(s.cat)+'</span>').join('');
    const k=SL.findIndex(s=>s.cat===manter);mostrar(k>=0?k:0);
  }else{
    let k=SL.findIndex(s=>s.cat===SEL.cat);if(k<0)k=0;idx=k;
    $('cats').innerHTML=SL.map((s,i)=>'<button class="tab'+(i===k?' on':'')+'" data-i="'+i+'">'+esc(s.cat)+'</button>').join('');
    $('cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{SEL.cat=SL[Number(b.dataset.i)].cat;sincronizarURL();desenhar(v)});
    st.innerHTML='<div class="slide"><div class="scroller">'+SL[k].html+'</div></div>';
  }
}
function mostrar(i){
  idx=i;SL.forEach((_,k)=>{const s=$('s'+k),p=$('p'+k);if(s)s.classList.toggle('active',k===i);if(p)p.classList.toggle('a',k===i)});
  limparTimers();const sc=document.querySelector('.slide.active .scroller');if(!sc)return;sc.scrollTop=0;
  const over=sc.scrollHeight-sc.clientHeight,next=()=>{timer=setTimeout(()=>mostrar((idx+1)%SL.length),1800)};
  if(over<=2){timer=setTimeout(next,SL.length>1?8000:1e9);return}
  timer=setTimeout(()=>{let pos=0,last=performance.now();
    (function f(now){const dt=now-last;last=now;pos+=55*dt/1000;sc.scrollTop=Math.min(pos,over);if(pos>=over){next();return}raf=requestAnimationFrame(f)})(performance.now())},1800);
}

/* ---------- menu (acompanhar) ---------- */
function sincronizarURL(){
  if(MODO_TV)return;const q=new URLSearchParams();q.set('ver',SEL.ver);
  if(SEL.ver==='camp'||SEL.ver==='prova'){q.set('prova',SEL.prova);q.set('vista',SEL.vista)}
  if(SEL.ver==='livre'&&SEL.id)q.set('id',SEL.id);
  if(SEL.ver==='nacional'&&SEL.nac&&SEL.nac!=='atual')q.set('nac',SEL.nac);
  if(SEL.cat)q.set('cat',SEL.cat);
  try{history.replaceState(null,'','?'+q.toString())}catch(e){}
}
function construirMenu(){
  if(MODO_TV)return;const m=$('menu');
  const ps=listaProvas(),campProvas=ps.filter(ehCampeonato),torneios=ps.filter(p=>!ehCampeonato(p)&&!CTRL.ocultas.includes(p.nome));
  const emTorneios=SEL.ver==='livre'||SEL.ver==='prova';
  const tabs=[['camp','Campeonato',SEL.ver==='camp'],['nacional','Nacional',SEL.ver==='nacional']];
  if(CTRL.publicados.length||torneios.length||emTorneios)tabs.push(['torneios','Torneios',emTorneios]);
  let h='<div class="tabs">'+tabs.map(([k,n,on])=>'<button class="tab'+(on?' on':'')+'" data-v="'+k+'">'+n+'</button>').join('')+'</div>';
  if(SEL.ver==='camp'){
    h+='<select id="selP"><option value="__anual__">Ranking anual</option>'+campProvas.map(p=>'<option value="'+esc(p.nome)+'"'+(p.nome===SEL.prova?' selected':'')+'>'+esc(p.nome)+'</option>').join('')+'</select>';
    const p=campProvas.find(x=>x.nome===SEL.prova);
    if(p&&p.njor>1)h+='<select id="selV"><option value="geral">Classificação geral</option>'+Array.from({length:p.njor},(_,i)=>i+1).map(j=>'<option value="'+j+'"'+(String(j)===String(SEL.vista)?' selected':'')+'>Jornada '+j+'</option>').join('')+'</select>'}
  if(SEL.ver==='nacional'){const op=nacOpcoes();
    if(op.length>1)h+='<select id="selN">'+op.map(o=>'<option value="'+esc(o.chave)+'"'+(o.chave===SEL.nac?' selected':'')+'>'+esc(o.nome)+'</option>').join('')+'</select>'}
  if(emTorneios){
    const lista=[...CTRL.publicados];if(SEL.ver==='livre'&&SEL.id&&!lista.find(x=>x.id===SEL.id))lista.unshift({id:SEL.id,nome:D.livre[SEL.id]?.meta?.nome||'Torneio'});
    h+='<div class="tabs">'+lista.map(t=>'<button class="tab'+(SEL.ver==='livre'&&t.id===SEL.id?' on':'')+'" data-t="'+esc(t.id)+'">'+esc(t.nome)+'</button>').join('')+
      torneios.map(p=>'<button class="tab'+(SEL.ver==='prova'&&p.nome===SEL.prova?' on':'')+'" data-p="'+esc(p.nome)+'">'+(EST_ROT[p.estado]?EST_ROT[p.estado]+' ':'')+esc(p.nome)+'</button>').join('')+'</div>'}
  m.innerHTML=h;
  m.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const k=b.dataset.v;
    if(k==='camp')escolher({ver:'camp',prova:'__anual__',vista:'geral'});
    else if(k==='nacional')escolher({ver:'nacional',nac:'atual'});
    else if(CTRL.publicados[0])escolher({ver:'livre',id:CTRL.publicados[0].id});
    else if(torneios[0])escolher({ver:'prova',prova:torneios[0].nome,vista:'geral'})});
  m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>escolher({ver:'livre',id:b.dataset.t}));
  m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>escolher({ver:'prova',prova:b.dataset.p,vista:'geral'}));
  const sp=$('selP');if(sp)sp.onchange=()=>escolher({prova:sp.value,vista:'geral'});
  const sv=$('selV');if(sv)sv.onchange=()=>escolher({vista:sv.value});
  const sn=$('selN');if(sn)sn.onchange=()=>escolher({nac:sn.value});
}
function escolher(o){userSel=true;SEL.cat='';Object.assign(SEL,o);garantir(SEL.ver,SEL.id);aplicar()}

/* ---------- aplicar ---------- */
function selDeCtrl(){SEL.ver=CTRL.fonte;SEL.prova=CTRL.camp.prova;SEL.vista=CTRL.camp.vista;SEL.id=CTRL.livre.id;SEL.nac=CTRL.nac.chave}
function aplicar(){
  try{
    if(MODO_TV||!userSel)selDeCtrl();
    garantir(SEL.ver,SEL.id);
    let v;if(!FS)v={msg:'Sem ligação à base de dados. Verifica a internet.'};
    else v=SEL.ver==='nacional'?viewNac():SEL.ver==='livre'?viewLivre():SEL.ver==='prova'?viewProva(SEL.prova,SEL.vista):viewCamp();
    construirMenu();desenhar(v);sincronizarURL();
  }catch(e){$('stage').innerHTML='<div class="empty">Ocorreu um erro ao mostrar os resultados. A tentar de novo…</div>';console.warn(e)}
}

/* ---------- arranque ---------- */
const sdk=await iniciarSDK();
if(!sdk){desenhar({msg:'Sem ligação à base de dados. Verifica a internet.'});ligacao(false)}
else{
  if(P.get('ver')){userSel=!MODO_TV;SEL.ver=P.get('ver');SEL.prova=P.get('prova')||'__anual__';SEL.vista=P.get('vista')||'geral';SEL.id=P.get('id')||'';SEL.nac=P.get('nac')||'atual';SEL.cat=P.get('cat')||''}
  escutarDoc('ctrl','tv_controlo',d=>{marcarCtrl(d)});
  setTimeout(aplicar,2500);
  setInterval(()=>{if(MODO_TV){ultimoDados=0;carregarDados().then(aplicar)}},600000);
}
</script>
